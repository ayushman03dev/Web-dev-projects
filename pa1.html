<!DOCTYPE html>
<html lang="en"> 
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shopping Bill</title>
        <style>
            body {
                background-color: rgb(236, 233, 237);
                font-family: Arial, sans-serif;
            }
            h1 {
                color: rgb(93, 10, 10);
            }
            table {
                width: 50%;
                margin: auto;
                border-collapse: collapse;
            }
            th, td {
                text-align: center;
            }
            th {
                background-color: rgb(93, 10, 10);
                color: white;
            
            }
            </style>

    </head> 
    <body>
        <h1 align="center">Shopping Bill</h1>

<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Price (₹)</th>
            <th>Amount (₹)</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Notebook</td>
            <td>2</td>
            <td>50</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Pen</td>
            <td>5</td>
            <td>10</td>
            <td>50</td>
        </tr>
        <tr>
            <td>Book</td>
            <td>1</td>
            <td>200</td>
            <td>200</td>
        </tr>
        <tr>
            <td>Bag</td>
            <td>1</td>
            <td>500</td>
            <td>500</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <th colspan="3">Grand Total</th>
            <th>850</th>
        </tr>
    </tfoot>
</table>

</body>
</html>
